# =============================================================================
# PETIVITY LITTER BOX — HomeOps Dirtiness Signal
# =============================================================================
# When a Petivity litter-box visit notification arrives via smsGateway,
# parse the visiting cat and POST a typed dirtiness signal to the
# HomeOps vacuum zone API.
#
# Trigger path:
#   Petivity app (Android) → MacroDroid intercepts push notification
#     → POST to smsGateway /webhook/notification
#       → smsGateway SSE fires smsgateway_notification HA bus event
#         → this automation
#
# Cat signal_type mapping (weight owned by HomeOps vacuum_signal_config):
#   Oliver  → petivity_visit_oliver  (base_weight=60)
#   Sasha   → petivity_visit_sasha   (base_weight=8)
#   Pancho  → petivity_visit_pancho  (base_weight=8)
#   unknown → manual_trigger         (fallback, base_weight=25)
#
# Routing by box_location (parsed from notification title):
#   "Family room"        → unit_name: "Ethan"  (3F, zone id=14, score=100)
#   "Downstairs monitor" → unit_name: "Saros"  (1F, zone id=23, score=12.51)
#   unknown              → unit_name: "Ethan"  (safe default)
# Cascade: Auto-derived from contained_by relationship (HomeOps handles cascade)
#
# Non-visit notifications (e.g. "Time to Freshen Up", "Petivity Alert",
# health alerts) are filtered by requiring "Visited" in the title.
#
# Auth: homeops.post_vacuum_zone_signal uses the API key stored in the
# HomeOps config entry — no secrets in this YAML file.
#
# Canonical location: C:/repos/homeops-ha/packages/petivity_litter_box.yaml
# Mirror to:          C:/repos/home-assistant-config/packages/vacuumops/petivity_litter_box.yaml
#
# Shipped: 2026-05-22 by GERTY
# Updated: 2026-07-11 by GERTY — route by box_location (Ethan=Family room, Saros=Downstairs monitor)
# =============================================================================

automation:

  - id: petivity_litter_box_dirtiness_signal
    alias: "Petivity — Litter Box Visit → HomeOps Dirtiness Signal"
    description: >
      When a Petivity cat visit notification arrives via smsGateway, parse the
      visiting cat name and box location, derive the signal_type, and POST a typed
      dirtiness signal to the HomeOps vacuum zone API — routing to Ethan (Family room)
      or Saros (Downstairs monitor) based on which box was used.
      HomeOps resolves the weight from vacuum_signal_config and auto-cascades via
      contained_by relationships.
    mode: queued
    max: 5

    triggers:
      - trigger: event
        event_type: smsgateway_notification

    # Filter to Petivity app + visit notifications only.
    # "Visited" appears in the title of every cat-visit notification.
    # Other Petivity titles ("Time to Freshen Up", "Petivity Alert",
    # health-alert bodies) do NOT contain "Visited" and are ignored.
    conditions:
      - condition: template
        value_template: >
          {{ trigger.event.data.get('package_name') == 'com.nestle.us.purina.petivity'
             and 'Visited' in (trigger.event.data.get('title') | default('')) }}

    actions:
      - variables:
          # Title format: "<CatName> Visited <BoxName> Litter Box"
          # First word of the title is always the cat's name.
          raw_title: "{{ trigger.event.data.get('title') | default('') }}"
          cat_name: "{{ raw_title.split(' ')[0] | lower }}"

          # Map cat name to signal_type row in vacuum_signal_config.
          # Unknown name falls through to manual_trigger (base=25) as a safe fallback.
          cat_signal_type: >
            {% if cat_name == 'oliver' %}
              petivity_visit_oliver
            {% elif cat_name == 'sasha' %}
              petivity_visit_sasha
            {% elif cat_name == 'pancho' %}
              petivity_visit_pancho
            {% else %}
              {# Unknown cat → treat as meaningfully dirty; base_weight=25 in vacuum_signal_config
                 (2.5× heavier than the old 10-point fallback weight). #}
              manual_trigger
            {% endif %}

          # Litter box location for routing and logging (extracted from title).
          box_location: >
            {% if 'Downstairs monitor' in raw_title %}
              Downstairs monitor
            {% elif 'Family room' in raw_title %}
              Family room
            {% else %}
              unknown
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ box_location | trim == 'Family room' }}"
            sequence:
              - action: homeops.post_vacuum_zone_signal
                data:
                  zone_label: "Litter Box"
                  unit_name: "Ethan"
                  source: "petivity"
                  signal_type: "{{ cat_signal_type | trim }}"
                  notes: "{{ raw_title }}"
          - conditions:
              - condition: template
                value_template: "{{ box_location | trim == 'Downstairs monitor' }}"
            sequence:
              - action: homeops.post_vacuum_zone_signal
                data:
                  zone_label: "Litter Box"
                  unit_name: "Saros"
                  source: "petivity"
                  signal_type: "{{ cat_signal_type | trim }}"
                  notes: "{{ raw_title }}"
        default:
          - action: homeops.post_vacuum_zone_signal
            data:
              zone_label: "Litter Box"
              unit_name: "Ethan"
              source: "petivity"
              signal_type: "{{ cat_signal_type | trim }}"
              notes: "{{ raw_title }}"

      - action: system_log.write
        data:
          message: >
            Petivity: {{ raw_title | default('(no title)') }}
            → cat={{ cat_name }}, box={{ box_location }}, signal_type={{ cat_signal_type | trim }}
            → unit={{ 'Saros' if box_location | trim == 'Downstairs monitor' else 'Ethan' }}
            → HomeOps signal posted (Litter Box; cascade auto-derived from contained_by)
          level: info
