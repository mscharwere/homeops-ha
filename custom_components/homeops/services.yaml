complete_item:
  name: Complete Maintenance Item
  description: >
    Log a completion for a HomeOps maintenance catalog item. The coordinator
    data is refreshed immediately after the API call so sensors update without
    waiting for the next poll interval.
  fields:
    item_code:
      name: Item Code
      description: >
        The catalog code for the maintenance item (e.g. "keurig_filter",
        "furnace_filter"). Must match the ``code`` field returned by the
        HomeOps API, or the slugified form of the item label.
      required: true
      example: keurig_filter
      selector:
        text:

snooze_item:
  name: Snooze Maintenance Item
  description: >
    Push the due date of a HomeOps maintenance item forward by N days. The
    coordinator data is refreshed immediately after the API call.
  fields:
    item_code:
      name: Item Code
      description: >
        The catalog code for the maintenance item (e.g. "keurig_filter",
        "furnace_filter"). Must match the ``code`` field returned by the
        HomeOps API, or the slugified form of the item label.
      required: true
      example: keurig_filter
      selector:
        text:
    days:
      name: Days
      description: >
        Number of days to snooze the item. Defaults to 7 if omitted.
        Accepted range: 1–365.
      required: false
      default: 7
      example: 14
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: days

post_condition_signal:
  name: Post Condition Signal
  description: >
    Upsert a condition signal for a HomeOps condition-type catalog item.
    Use this to drive urgency from HA sensor data (e.g. humidity, power draw)
    rather than a daily clock. The signal expires after valid_for_hours so
    HomeOps degrades gracefully if HA goes offline.
  fields:
    code:
      name: Item Code
      description: >
        Catalog code of the condition item, e.g. "oliver_feeder_desiccant".
        Must match a catalog item with counter_type='condition'.
      required: true
      example: oliver_feeder_desiccant
      selector:
        text:
    urgency:
      name: Urgency
      description: >
        Float 0.0–1.0. Values >= condition_pick_min_urgency surface the item
        in the picker; 1.0 = overdue.
      required: true
      example: 0.65
      selector:
        number:
          min: 0
          max: 1
          step: 0.001
          mode: box
    source:
      name: Source
      description: >
        Identifier for the signal source shown in HomeOps UI, e.g.
        "ha.feeder_humidity".
      required: true
      example: ha.feeder_humidity
      selector:
        text:
    reason:
      name: Reason
      description: >
        Human-readable explanation displayed in HomeOps maintenance cards.
      required: false
      example: 42.5 high-humidity hours accumulated; 18 days since replaced
      selector:
        text:
          multiline: true
    valid_for_hours:
      name: Valid For (hours)
      description: >
        TTL override in hours. Must be > 0 — zero would expire the signal
        immediately. Defaults to the catalog item's condition_ttl_hours.
        Automations posting hourly typically use 2.
      required: false
      example: 2
      selector:
        number:
          min: 0.1
          max: 720
          step: 0.5
          mode: box
          unit_of_measurement: hours

post_vacuum_zone_signal:
  name: Post Vacuum Zone Signal
  description: >
    Post a typed dirtiness signal for a HomeOps vacuum zone. HomeOps resolves the
    signal weight from vacuum_signal_config and applies any matching context modifiers
    (weather, season). Cascade to child zones is automatic via contained_by relationships.
  fields:
    zone_label:
      name: Zone Label
      description: >
        Zone label as configured in HomeOps, e.g. "Litter Box".
      required: true
      example: Litter Box
      selector:
        text:
    unit_name:
      name: Unit Nickname
      description: >
        Unit nickname as stored in the HomeOps database (e.g. "Ethan", "Sam").
        Case-insensitive match against the HomeOps DB nickname field.
      required: true
      example: Ethan
      selector:
        text:
    source:
      name: Source
      description: >
        Signal source identifier shown in HomeOps logs, e.g. "petivity", "ha.entry_door".
      required: false
      example: petivity
      selector:
        text:
    signal_type:
      name: Signal Type
      description: >
        Key into vacuum_signal_config, e.g. "petivity_visit_oliver", "entry_door_open".
        Must match a row exactly (case-sensitive). Manage weights in HomeOps Signal Config panel.
      required: true
      example: entry_door_open
      selector:
        text:
    context:
      name: Context
      description: >
        Optional map of context conditions that scale the base weight.
        Recognised keys: weather (rainy|muddy|clear), season (fall|spring|summer|winter).
      required: false
      example: '{"weather": "rainy", "season": "fall"}'
      selector:
        object:
    notes:
      name: Notes
      description: >
        Optional free-text note included in the signal log and socket event.
        Not persisted to the zone record.
      required: false
      example: Front door opened 6:42PM
      selector:
        text:
